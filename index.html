<title>IK Deal or No Deal</title>
<style>
:root{--ink:#f6f1ff;--gold:#ffc83d;--gold2:#ff9d1f;--ok:#2fd27a;--bad:#ff4d6d;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;-webkit-user-select:none;user-select:none;color:var(--ink);font-family:"Avenir Next","Segoe UI",Roboto,sans-serif;background:#120c2b}
body{position:fixed;inset:0;background:radial-gradient(120% 60% at 50% -10%,#5b2bb8 0%,#2a1566 40%,#120c2b 80%) fixed;}
main{max-width:480px;height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;width:100%;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h1{font-size:23px;line-height:1.25;margin:14px 0 6px;font-weight:800}
p{line-height:1.5;margin:8px 0;color:#e2d9f7}

.btn{display:block;width:100%;padding:15px 18px;margin:10px 0;font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;cursor:pointer;text-align:left;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{text-align:center;color:#2a1566;border:0;font-weight:800;background:linear-gradient(180deg,#ffe07a,var(--gold) 50%,var(--gold2));box-shadow:0 6px 22px rgba(255,170,30,.4)}
.btn.ok{background:rgba(47,210,122,.22);border-color:var(--ok)}
.btn.bad{background:rgba(255,77,109,.22);border-color:var(--bad)}

.btn[disabled]{pointer-events:none}
.board{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;gap:5px 6px;margin:10px 0;padding:8px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.v{padding:5px 2px;text-align:center;border-radius:999px;font-weight:800;font-size:10.5px;background:linear-gradient(180deg,#3d2a85,#2a1a66);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:opacity .4s}
.v.hi{background:linear-gradient(180deg,#ffe07a,var(--gold2));color:#2a1566}
.v.gone{opacity:.18;text-decoration:line-through;box-shadow:none}
.cases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;gap:12px 6px;margin:16px 0}
.case{position:relative;min-width:0;width:100%;aspect-ratio:1.15;margin-top:8px;font:inherit;font-weight:900;font-size:16px;color:#4a2a00;border:0;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,#ffe07a 0%,var(--gold) 45%,var(--gold2) 100%);box-shadow:0 6px 0 #a85d00,0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55);padding:0;transition:transform .12s}
.case::before{content:"";position:absolute;left:30%;right:30%;top:-8px;height:10px;border:3px solid #c97a00;border-bottom:0;border-radius:8px 8px 0 0}
.case::after{content:"";position:absolute;left:0;right:0;top:46%;height:3px;background:rgba(120,60,0,.35)}
.case:active{transform:translateY(4px);box-shadow:0 2px 0 #a85d00,0 4px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.case.mine{outline:3px solid var(--ok);outline-offset:3px}
.case.open{background:#241652;color:#b9a9e3;font-size:10px;box-shadow:none;pointer-events:none;border:1px dashed var(--line)}
.case.open::before,.case.open::after{display:none}
.offer{text-align:center;padding:24px 16px;margin:16px 0;border-radius:22px;background:linear-gradient(180deg,rgba(255,200,61,.18),rgba(255,200,61,.05));border:1.5px solid rgba(255,200,61,.5);box-shadow:0 0 40px rgba(255,170,30,.25);animation:pop .5s ease-out}
.big{font-size:46px;font-weight:900;margin-top:4px;background:linear-gradient(180deg,#fff2b0,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;font-size:13px;color:#b9a9e3;font-weight:600}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.offer{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.chip.sel{background:linear-gradient(180deg,#ffe07a,var(--gold2));color:#2a1566;border-color:transparent}
.lab{font-size:13px;font-weight:800;color:#b9a9e3;margin-top:12px}
.inp{display:block;width:100%;padding:13px 14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.inp::placeholder{color:#b9a9e3}
.warn{margin:10px 0;padding:12px 14px;border-radius:14px;background:rgba(255,200,61,.14);border:1.5px solid rgba(255,200,61,.5);font-size:14px;line-height:1.45;color:#ffe9a8}

function set(k,v){C[k]=v;render()}
function chips(k,arr,sel){return '<div class="chips">'+arr.map((x,i)=>'<button class="chip'+(i===sel?' sel':'')+'" onclick="set(\''+k+'\','+i+')">'+x+'</button>').join("")+'</div>'}
function render(){let h="";
if(S.ph==="intro"){h=topbar()+'<div class="logo"><small>IK</small>Deal or<br>No Deal</div>'+
'<div class="lab">'+t(0)+'</div>'+chips("l",LN.map((x,i)=>FL[i]+" "+x),C.l)+
'<div class="lab">'+t(1)+'</div>'+chips("d",[22,23,24,25,26].map(k=>t(k)),C.d)+
'<div class="lab">'+t(2)+'</div>'+chips("s",[27,28,29].map((k,i)=>t(k)+" · "+SZ[i].n),C.s)+
'<p class="sub">'+t(21)+'</p><button class="btn gold" onclick="start()">'+t(3)+'</button>'}
else if(S.ph==="acct"){const m=me();const bk='<button class="btn" style="text-align:center" onclick="go(\'intro\')">'+t(42)+'</button>';
if(!m){h='<h1>'+t(30)+'</h1><div class="warn">⚠️ '+t(49)+'</div><input class="inp" id="un" maxlength="16" autocomplete="username" placeholder="'+t(31)+'"><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="'+t(32)+'">'+(msg?'<p style="color:#ff8aa0;font-weight:700">'+msg+'</p>':'')+'<button class="btn gold" onclick="login()">'+t(33)+'</button><button class="btn" style="text-align:center" onclick="reg()">'+t(34)+'</button>'+bk}
else{h='<h1>👤 '+esc(m.name)+'</h1><div class="offer" style="margin:8px 0"><div class="sub">'+t(36)+'</div><div class="big">⭐ '+m.pts+'</div></div>'+(msg?'<p style="color:#7bf0b0;font-weight:700">'+msg+'</p>':'')+(m.pts>=100?'<button class="btn gold" onclick="go(\'addq\')">'+t(37)+'</button>':'<p class="sub">'+t(43)+' ('+m.pts+'/100)</p>')+(m.qs.length?'<div class="lab">'+t(50)+'</div>'+m.qs.map((x,i)=>'<div class="btn" style="display:flex;justify-content:space-between;gap:8px;font-size:14px;cursor:default"><span>'+esc(x.q)+'</span><span style="cursor:pointer;padding:0 4px" onclick="delQ('+i+')">✕</span></div>').join(""):'')+'<button class="btn" style="text-align:center" onclick="logout()">'+t(35)+'</button>'+bk+'<div class="warn">⚠️ '+t(49)+'</div>'}}
else if(S.ph==="addq"){h='<h1>'+t(37)+'</h1><input class="inp" id="nq" maxlength="100" placeholder="'+t(38)+'"><input class="inp" id="a0" maxlength="50" placeholder="✅ '+t(39)+'">'+[1,2,3].map(i=>'<input class="inp" id="a'+i+'" maxlength="50" placeholder="❌ '+t(40)+'">').join("")+'<button class="btn gold" onclick="saveQ()">'+t(41)+'</button><button class="btn" style="text-align:center" onclick="go2(\'acct\')">'+t(42)+'</button>'}
else if(S.ph==="pick"){h='<h1>'+t(4)+'</h1>'+board()+cases(true)}
else if(S.ph==="quiz"){h='<div class="top"><span>'+t(5)+' '+(S.round+1)+'/'+S.z.R.length+'</span><span>⭐ '+pts()+'</span></div>'+board()+(S.note?'<p style="color:#ff8aa0;font-weight:700">'+S.note+'</p>':'')+'<h1 style="font-size:21px;margin-top:18px">'+esc(S.q.q)+'</h1>';
S.q.o.forEach((o,k)=>{let c="";if(S.ans!==null){if(k===S.q.a)c=" ok";else if(k===S.ans)c=" bad"}
h+='<button class="btn'+c+'" '+(S.ans!==null?'disabled':'')+' onclick="answer('+k+')">'+esc(o)+'</button>'});
if(S.ans!==null){h+='<p>'+(S.ans===S.q.a?t(6,{n:S.z.R[S.round]})+' +5 ⭐':t(7))+'</p><button class="btn gold" onclick="afterQ()">'+t(8)+'</button>'}}
else if(S.ph==="open"){h='<h1 style="font-size:21px">'+t(9,{n:S.left})+'</h1>'+board()+cases(true)}
else if(S.ph==="offer"){h=board()+cases(false)+'<div class="offer"><div class="sub">📞 '+t(10)+'</div><div class="big">'+fmt(S.offer)+'</div></div><button class="btn deal" onclick="deal()">'+t(11)+'</button><button class="btn nodeal" onclick="nodeal()">'+t(12)+'</button>'}
else if(S.ph==="final"){const o=rest()[0];h='<h1>'+t(13,{a:S.mine+1,b:o+1})+'</h1>'+cases(false)+'<button class="btn gold" onclick="final(false)">'+t(14)+'</button><button class="btn" onclick="final(true)">'+t(15)+'</button>'}
else if(S.ph==="end"){const f=S.swapped!==undefined;
h='<h1>'+t(16)+'</h1><div class="offer"><div class="sub">'+t(17)+'</div><div class="big">'+fmt(S.win)+'</div></div><p>'+(f?t(20)+' '+fmt(S.other):t(19)+' '+fmt(S.c[S.mine]))+'.</p><button class="btn gold" onclick="S={ph:\'intro\'};render()">'+t(18)+'</button>'}
$.innerHTML=h;$.scrollTop=0}
["gesturestart","gesturechange","dblclick"].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
render();
</script>
</body>
</html>
